name: Response time monitor

on:
  schedule:
    - cron: "*/15 * * * *" # a cada 15 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: response-monitor
  cancel-in-progress: false

env:
  SITE_URL: https://pimenta.dev
  PHOTO_URL: https://pimenta.dev/profile.jpg # foto de perfil exibida na página
  SAMPLES: "5"
  MAX_TTFB_MS: "1000" # o runner do GitHub mede ~610 ms; 800 ms dava pouca folga
  MAX_TOTAL_MS: "1500"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # O histórico fica na branch "metrics" para não encher a main de commits.
      - name: Prepare metrics branch
        run: |
          if git fetch --depth=1 origin metrics; then
            git worktree add -B metrics metrics-branch origin/metrics
          else
            git worktree add --orphan -b metrics metrics-branch
          fi

      - name: Measure response time
        id: measure
        run: |
          set +e
          status=0
          for url in "$SITE_URL" "$PHOTO_URL"; do
            bash scripts/check-response.sh \
              --url "$url" \
              --csv metrics-branch/response-times.csv \
              --source github-actions || status=$?
            echo
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit measurements
        working-directory: metrics-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add response-times.csv
          git commit -m "metrics: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin metrics

      # Falhar o job faz o GitHub enviar e-mail de alerta para quem mantém o repo.
      - name: Fail on threshold breach
        if: steps.measure.outputs.status != '0'
        run: |
          echo "::error::Tempo de resposta acima do limite ou site com falha (exit ${{ steps.measure.outputs.status }})"
          exit 1
